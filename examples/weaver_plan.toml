# The plan that built weaver, and its first test input.
#
# Schema 1 (every field is described in the README)
#   [plan]        schema = 1 (required), title (required), goal, caption
#   [[node]]      id (required, [A-Za-z0-9_.-]+), title (required)
#                 kind = atom | merge                      (default atom)
#                 status = todo | doing | done | blocked   (default todo)
#                 group                        the parallel strand the node runs in
#                 deps = [...]                 build seams   (static dependency)
#                 runtime_deps = [...]         runtime seams (dynamic dependency)
#                 scope = I L P U G ?          reach
#                 amount = 1 F N B S ?         breadth
#                 complexity = T E M H N ?     depth
#                 verify                       the check that proves the node done
#                 decisions = ["D-1", ...]     the decisions behind the node
#                 notes                        free text

[plan]
schema = 1
title = "weaver — the plan that built it"
goal = "python -m weaver build turns this file into a clickable HTML graph, a Markdown table and a PDF, with every view tested."
caption = "One plan file, three views. A0 is the shared contract and lands first; the A2→A3 strand runs in parallel with the main strand; M1 is the only merge, and the end-to-end test guards it."

[[node]]
id = "A0"
title = "Data contract: Plan model + TOML schema"
status = "done"
group = "main"
scope = "P"
amount = "F"
complexity = "M"
verify = "tests/test_load.py"
notes = """
The contract every other atom builds against: Plan, Node, Dep, Edge in weaver/model.py, plus this file as the schema example.
Lands first, so the parallel strands share no other file.
"""

[[node]]
id = "A1"
title = "Loader + validator"
status = "done"
group = "main"
deps = ["A0"]
scope = "L"
amount = "N"
complexity = "M"
verify = "tests/test_load.py"
notes = """
load_plan / parse_plan. Reports every error in one run: unknown keys, bad ids, kinds, statuses and codes, unknown or duplicate deps, self-deps, cycles (with the path), a missing or unknown schema version.
"""

[[node]]
id = "A2"
title = "Graphviz export: .dot + SVG"
status = "done"
group = "graph"
deps = ["A0"]
scope = "L"
amount = "F"
complexity = "M"
verify = "tests/test_dot.py"
notes = """
Shape by kind (atom vs merge), line style by seam (build solid, runtime dashed), fill by status, lanes by group, border colour by scope and border weight by complexity.
Contract with A3 and A5: every SVG node group carries id="node-<id>".
"""

[[node]]
id = "A3"
title = "HTML view: zoom, pan, pinch, click → modal"
status = "done"
group = "graph"
deps = ["A0", "A2"]
scope = "L"
amount = "F"
complexity = "H"
verify = "tests/test_html.py, tests/test_gestures.py"
notes = """
One self-contained file, no CDN. Node data travels as escaped JSON; the modal fills via textContent only, never innerHTML. A Content-Security-Policy admits the one script and the one style block by hash.
Gesture handling is a DOM-free core, tested under Node.
"""

[[node]]
id = "A4"
title = "Markdown table export"
status = "done"
group = "main"
deps = ["A1"]
scope = "I"
amount = "1"
complexity = "E"
verify = "tests/test_views_md_pdf.py"
notes = "The view GitHub can render. Pipes and newlines in cells are escaped."

[[node]]
id = "A5"
title = "PDF view: graph + caption + field notes"
status = "done"
group = "main"
deps = ["A0"]
runtime_deps = ["A2"]
scope = "I"
amount = "1"
complexity = "E"
verify = "tests/test_views_md_pdf.py"
notes = """
WeasyPrint, no JavaScript: the static stand-in for the modals.
Runtime seam on A2 because it consumes the SVG A2 produces, not A2's code.
"""

[[node]]
id = "M1"
title = "CLI build + end-to-end test"
kind = "merge"
status = "done"
group = "main"
deps = ["A1", "A3", "A4", "A5"]
scope = "P"
amount = "F"
complexity = "E"
verify = "tests/test_cli.py"
notes = """
python -m weaver build PLAN.toml -o out/ → PLAN.html, PLAN.md, PLAN.pdf, plan.svg.
The end-to-end test is the oracle for the merge.
"""
